<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${editing ? 'Edit room type' : 'Add room type'} + ' | Aurelia House'">Room type | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body class="admin-body"><div class="admin-shell"><div th:replace="~{fragments/admin-layout :: sidebar('room-types')}"></div><main class="admin-main"><header class="admin-topbar"><div><a class="admin-back" th:href="@{/admin/room-types}">← Room types</a><h1 th:text="${editing ? 'Edit room type' : 'Add a room type'}">Add a room type</h1></div></header><section class="admin-panel admin-form-panel"><form th:object="${roomTypeForm}" th:action="${editing ? '/admin/room-types/' + roomTypeId : '/admin/room-types'}" method="post" class="admin-form"><div class="admin-form-grid"><label>Type name<input th:field="*{name}" required maxlength="60"><span class="field-error" th:errors="*{name}"></span></label><label class="admin-form-wide">Description<textarea th:field="*{description}" rows="4" maxlength="500"></textarea><span class="field-error" th:errors="*{description}"></span></label></div><div class="admin-form-actions"><a class="button button-outline" th:href="@{/admin/room-types}">Discard</a><button class="button" type="submit" th:text="${editing ? 'Save changes' : 'Add type'}">Add type</button></div></form></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
