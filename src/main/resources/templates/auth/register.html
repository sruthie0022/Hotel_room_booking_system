<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/layout :: header}"></div>
<main class="auth-layout"><div class="auth-image auth-image-register" role="img" aria-label="A welcoming hotel entrance"></div><section class="auth-panel"><span class="eyebrow">AURELIA HOUSE</span><h1>Stay a little<br><em>closer.</em></h1><p class="auth-intro">Create an account to plan your next stay and keep every detail in one place.</p>
    <form th:action="@{/register}" th:object="${registrationRequest}" method="post" class="form-stack" data-loading data-loading-label="Creating your account...">
        <label>Full name<input type="text" th:field="*{fullName}" autocomplete="name" required maxlength="100"><span class="field-error" th:errors="*{fullName}"></span></label>
        <label>Email address<input type="email" th:field="*{email}" autocomplete="email" required maxlength="190"><span class="field-error" th:errors="*{email}"></span></label>
        <label>Phone number<input type="tel" th:field="*{phoneNumber}" autocomplete="tel" required maxlength="30"><span class="field-error" th:errors="*{phoneNumber}"></span></label>
        <label>Password<input type="password" th:field="*{password}" autocomplete="new-password" required minlength="10" maxlength="72"><span class="field-hint">10+ characters with uppercase, lowercase, a number, and a symbol.</span><span class="field-error" th:errors="*{password}"></span></label>
        <button class="button w-100" type="submit">Create account <span>↗</span></button>
    </form><p class="auth-switch">Already have an account? <a th:href="@{/login}">Sign in</a></p></section></main>
<div th:replace="~{fragments/layout :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/site.js}"></script></body>
</html>
