<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room inventory | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body class="admin-body"><div class="admin-shell"><div th:replace="~{fragments/admin-layout :: sidebar('rooms')}"></div><main class="admin-main"><header class="admin-topbar"><div><span class="eyebrow">INVENTORY</span><h1>Rooms</h1></div><div class="admin-topbar-actions"><a class="text-link" th:href="@{/admin/room-types}">Room types <span>↗</span></a><a class="button button-small" th:href="@{/admin/rooms/new}">Add a room <span>＋</span></a></div></header><div class="notice notice-success" th:if="${success}" th:text="${success}"></div><section class="admin-panel"><div class="panel-heading"><div><span class="eyebrow">ROOM CATALOGUE</span><h2 th:text="${rooms.size() + ' rooms'}">24 rooms</h2></div></div><div class="table-scroll"><table class="admin-table"><thead><tr><th>ROOM</th><th>TYPE</th><th>CAPACITY</th><th>RATE / NIGHT</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody><tr th:each="room : ${rooms}"><td><div class="room-table-cell"><img th:src="${room.heroImageUrl}" th:alt="${room.name}"><span><strong th:text="${room.name}">The City Deluxe</strong><small th:text="${'Room ' + room.roomNumber}">Room 101</small></span></div></td><td th:text="${room.roomType.name}">Deluxe</td><td th:text="${room.capacity + ' guests'}">2 guests</td><td th:text="${'$' + #numbers.formatDecimal(room.pricePerNight, 1, 2)}">$245.00</td><td><span class="status-pill" th:classappend="${room.enabled ? ' status-confirmed' : ' status-cancelled'}" th:text="${room.enabled ? 'LISTED' : 'HIDDEN'}">LISTED</span></td><td><div class="table-actions"><a class="icon-action" th:href="@{/admin/rooms/{id}/edit(id=${room.id})}" aria-label="Edit room" title="Edit room">✎</a><form th:if="${room.enabled}" th:action="@{/admin/rooms/{id}/delete(id=${room.id})}" method="post"><button class="icon-action danger-action" type="submit" aria-label="Hide room" title="Hide room" data-confirm="Remove this room from customer search?">×</button></form></div></td></tr><tr th:if="${rooms.isEmpty()}"><td colspan="6" class="empty-table">No rooms have been added.</td></tr></tbody></table></div></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
