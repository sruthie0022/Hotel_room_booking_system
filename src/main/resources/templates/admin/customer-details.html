<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer profile | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body class="admin-body"><div class="admin-shell"><div th:replace="~{fragments/admin-layout :: sidebar('customers')}"></div><main class="admin-main"><header class="admin-topbar"><div><a class="admin-back" th:href="@{/admin/customers}">← All customers</a><h1 th:text="${customer.fullName}">Avery Collins</h1></div></header><section class="admin-panel profile-panel"><div><span class="eyebrow">EMAIL</span><strong th:text="${customer.email}">avery@example.com</strong></div><div><span class="eyebrow">PHONE</span><strong th:text="${customer.phoneNumber}">+1 555 0100</strong></div><div><span class="eyebrow">MEMBER SINCE</span><strong th:text="${#temporals.format(customer.createdAt, 'MMMM d, yyyy')}">January 18, 2025</strong></div></section><section class="admin-panel recent-panel"><div class="panel-heading"><div><span class="eyebrow">GUEST HISTORY</span><h2>Bookings <span class="count-tag" th:text="${bookings.size()}">3</span></h2></div></div><div class="table-scroll"><table class="admin-table"><thead><tr><th>REFERENCE</th><th>ROOM</th><th>DATES</th><th>TOTAL</th><th>STATUS</th></tr></thead><tbody><tr th:each="booking : ${bookings}"><td class="reference-cell" th:text="${booking.bookingReference}">AH32FG5K</td><td th:text="${booking.room.name}">The City Deluxe</td><td th:text="${#temporals.format(booking.checkIn, 'MMM d') + ' - ' + #temporals.format(booking.checkOut, 'MMM d, yyyy')}">May 6 - May 9</td><td th:text="${'$' + #numbers.formatDecimal(booking.totalPrice, 1, 2)}">$735.00</td><td><span class="status-pill" th:classappend="${' status-' + #strings.toLowerCase(booking.status.name())}" th:text="${booking.status}">CONFIRMED</span></td></tr><tr th:if="${bookings.isEmpty()}"><td colspan="5" class="empty-table">This customer has no bookings yet.</td></tr></tbody></table></div></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
