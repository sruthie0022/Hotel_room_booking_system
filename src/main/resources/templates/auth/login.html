<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/layout :: header}"></div>
<main class="auth-layout"><div class="auth-image" role="img" aria-label="A tranquil hotel room"></div><section class="auth-panel"><span class="eyebrow">WELCOME BACK</span><h1>Your room<br>is <em>waiting.</em></h1><div class="notice notice-success" th:if="${param.registered}">Your account is ready. Sign in to plan your stay.</div><div class="notice notice-error" th:if="${param.error}">That email or password didn't match. Please try again.</div><div class="notice notice-success" th:if="${param.logout}">You have signed out.</div>
    <form th:action="@{/login}" method="post" class="form-stack" data-loading data-loading-label="Signing in..."><label>Email address<input type="email" name="username" autocomplete="email" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button w-100" type="submit">Sign in <span>↗</span></button></form><p class="auth-switch">New to Aurelia? <a th:href="@{/register}">Create an account</a></p></section></main>
<div th:replace="~{fragments/layout :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/site.js}"></script></body>
</html>
