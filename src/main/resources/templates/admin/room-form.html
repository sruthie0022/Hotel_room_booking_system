<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${editing ? 'Edit room' : 'Add room'} + ' | Aurelia House'">Room | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body class="admin-body"><div class="admin-shell"><div th:replace="~{fragments/admin-layout :: sidebar('rooms')}"></div><main class="admin-main"><header class="admin-topbar"><div><a class="admin-back" th:href="@{/admin/rooms}">← Room inventory</a><h1 th:text="${editing ? 'Edit room' : 'Add a room'}">Add a room</h1></div></header><section class="admin-panel admin-form-panel"><form th:object="${roomForm}" th:action="${editing ? '/admin/rooms/' + roomId : '/admin/rooms'}" method="post" enctype="multipart/form-data" class="admin-form"><div class="admin-form-grid"><label>Room number<input th:field="*{roomNumber}" required maxlength="20"><span class="field-error" th:errors="*{roomNumber}"></span></label><label>Room name<input th:field="*{name}" required maxlength="100"><span class="field-error" th:errors="*{name}"></span></label><label>Room type<select th:field="*{roomTypeId}" required><option value="">Choose a type</option><option th:each="type : ${roomTypes}" th:value="${type.id}" th:text="${type.name}">Deluxe</option></select><span class="field-error" th:errors="*{roomTypeId}"></span></label><label>Maximum guests<input type="number" th:field="*{capacity}" min="1" max="20" required><span class="field-error" th:errors="*{capacity}"></span></label><label>Price per night<input type="number" th:field="*{pricePerNight}" min="1" step="0.01" required><span class="field-error" th:errors="*{pricePerNight}"></span></label><label class="admin-form-wide">Description<textarea th:field="*{description}" rows="4" required maxlength="2000"></textarea><span class="field-error" th:errors="*{description}"></span></label><label>Amenities <small>Separate with commas</small><textarea th:field="*{amenitiesText}" rows="3" placeholder="King bed, Rain shower, Fast Wi-Fi"></textarea></label><label>Image URLs <small>One per line</small><textarea th:field="*{imageUrlsText}" rows="3" placeholder="https://..."></textarea></label><label class="admin-form-wide">Upload an image<input type="file" name="image" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG, or WebP. Maximum 10 MB. Uploads are stored with generated filenames.</small></label><label class="admin-toggle"><input type="checkbox" th:field="*{enabled}"><span>Listed for booking</span></label></div><div class="field-error" th:each="error : ${#fields.globalErrors()}"><span th:text="${error}"></span></div><div class="admin-form-actions"><a class="button button-outline" th:href="@{/admin/rooms}">Discard</a><button class="button" type="submit" th:text="${editing ? 'Save changes' : 'Add room'}">Add room</button></div></form></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
