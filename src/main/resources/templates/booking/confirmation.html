<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stay confirmed | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/layout :: header}"></div><main class="confirmation-page container"><div class="confirmation-mark">✓</div><span class="eyebrow">IT'S OFFICIAL</span><h1>Your stay is <em>confirmed.</em></h1><p class="confirmation-intro">We look forward to welcoming you to Aurelia House.</p><div class="confirmation-card"><div><span class="eyebrow">BOOKING REFERENCE</span><strong class="reference-code" th:text="${booking.bookingReference}">AH7K3Q9M</strong></div><div><span class="eyebrow">YOUR ROOM</span><strong th:text="${booking.room.name}">The City Deluxe</strong></div><div><span class="eyebrow">YOUR DATES</span><strong th:text="${#temporals.format(booking.checkIn, 'MMM d, yyyy') + ' — ' + #temporals.format(booking.checkOut, 'MMM d, yyyy')}">Jun 12 — Jun 15</strong></div><div><span class="eyebrow">SIMULATED PAYMENT</span><strong th:text="${booking.payment.paymentReference}">SIM-012345</strong></div><div class="confirmation-total"><span>Total · <span th:text="${booking.guests + (booking.guests == 1 ? ' guest' : ' guests')}">2 guests</span></span><strong th:text="${'$' + #numbers.formatDecimal(booking.totalPrice, 1, 2)}">$735.00</strong></div></div><div class="confirmation-actions"><a class="button" th:href="@{/my-bookings}">View my stays <span>↗</span></a><a class="text-link" th:href="@{/rooms}">Explore more rooms <span>↗</span></a></div></main><div th:replace="~{fragments/layout :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/site.js}"></script></body>
</html>
