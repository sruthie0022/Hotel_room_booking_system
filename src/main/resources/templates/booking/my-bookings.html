<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My stays | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"></head>
<body><div th:replace="~{fragments/layout :: header}"></div><main class="container account-page"><div class="page-heading"><span class="eyebrow">YOUR AURELIA HOUSE</span><h1>My <em>stays.</em></h1><p>Every visit, all in one place.</p></div><div class="notice notice-success" th:if="${success}" th:text="${success}"></div><div class="notice notice-error" th:if="${error}" th:text="${error}"></div>
    <div class="bookings-list" th:if="${!bookings.isEmpty()}"><article class="booking-history-card" th:each="booking : ${bookings}"><img th:src="${booking.room.heroImageUrl}" th:alt="${booking.room.name}" loading="lazy"><div class="history-main"><span class="eyebrow" th:text="${booking.bookingReference}">AH7K3Q9M</span><h2 th:text="${booking.room.name}">The City Deluxe</h2><p th:text="${#temporals.format(booking.checkIn, 'MMM d, yyyy') + ' — ' + #temporals.format(booking.checkOut, 'MMM d, yyyy')}">Jun 12 — Jun 15</p><span class="status-pill" th:classappend="${' status-' + #strings.toLowerCase(booking.status.name())}" th:text="${booking.status}">CONFIRMED</span></div><div class="history-total"><span class="eyebrow">TOTAL</span><strong th:text="${'$' + #numbers.formatDecimal(booking.totalPrice, 1, 2)}">$735.00</strong><form th:if="${booking.status.name() == 'CONFIRMED' or booking.status.name() == 'PENDING'}" th:action="@{/my-bookings/{reference}/cancel(reference=${booking.bookingReference})}" method="post"><button class="cancel-link" type="submit" data-confirm="Cancel this reservation? The simulated payment will be refunded.">Cancel stay</button></form></div></article></div>
    <div class="empty-state" th:if="${bookings.isEmpty()}"><span class="eyebrow">YOUR NEXT CHAPTER</span><h2>No stays booked yet.</h2><p>There’s a room here when you're ready.</p><a class="button" th:href="@{/rooms}">Find your room <span>↗</span></a></div>
</main><div th:replace="~{fragments/layout :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/site.js}"></script></body>
</html>
