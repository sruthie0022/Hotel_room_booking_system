<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customers | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body class="admin-body"><div class="admin-shell"><div th:replace="~{fragments/admin-layout :: sidebar('customers')}"></div><main class="admin-main"><header class="admin-topbar"><div><span class="eyebrow">GUEST RELATIONSHIPS</span><h1>Customers</h1></div></header><div class="notice notice-success" th:if="${success}" th:text="${success}"></div><section class="admin-panel"><form th:action="@{/admin/customers}" method="get" class="customer-search"><input type="search" name="search" th:value="${search}" placeholder="Search by name or email"><button class="button button-small" type="submit">Search <span>↗</span></button></form><div class="table-scroll"><table class="admin-table"><thead><tr><th>CUSTOMER</th><th>PHONE</th><th>MEMBER SINCE</th><th>ACCOUNT</th><th>HISTORY</th><th>ACCESS</th></tr></thead><tbody><tr th:each="customer : ${customers}"><td><strong th:text="${customer.fullName}">Avery Collins</strong><small class="table-subline" th:text="${customer.email}">avery@example.com</small></td><td th:text="${customer.phoneNumber}">+1 555 0100</td><td th:text="${#temporals.format(customer.createdAt, 'MMM d, yyyy')}">Jan 18, 2025</td><td><span class="status-pill" th:classappend="${customer.enabled ? ' status-confirmed' : ' status-cancelled'}" th:text="${customer.enabled ? 'ACTIVE' : 'DISABLED'}">ACTIVE</span></td><td><a class="text-link" th:href="@{/admin/customers/{id}(id=${customer.id})}">View stays <span>↗</span></a></td><td><form th:action="@{/admin/customers/{id}/enabled(id=${customer.id})}" method="post"><input type="hidden" name="enabled" th:value="${!customer.enabled}"><button class="customer-toggle" type="submit" th:text="${customer.enabled ? 'Disable' : 'Enable'}">Disable</button></form></td></tr><tr th:if="${customers.isEmpty()}"><td colspan="6" class="empty-table">No customers found.</td></tr></tbody></table></div></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
