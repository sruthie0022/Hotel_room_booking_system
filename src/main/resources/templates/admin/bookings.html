<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bookings | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body class="admin-body"><div class="admin-shell"><div th:replace="~{fragments/admin-layout :: sidebar('bookings')}"></div><main class="admin-main"><header class="admin-topbar"><div><span class="eyebrow">GUEST JOURNEYS</span><h1>Bookings</h1></div></header><div class="notice notice-success" th:if="${success}" th:text="${success}"></div><div class="notice notice-error" th:if="${error}" th:text="${error}"></div><section class="admin-panel"><form th:action="@{/admin/bookings}" method="get" class="admin-filter-form"><label>Search<input type="search" name="search" placeholder="Reference, name, email" th:value="${search}"></label><label>Status<select name="status"><option value="">All statuses</option><option th:each="state : ${statuses}" th:value="${state}" th:selected="${state == selectedStatus}" th:text="${state}">CONFIRMED</option></select></label><label>From<input type="date" name="fromDate" th:value="${fromDate}"></label><label>To<input type="date" name="toDate" th:value="${toDate}"></label><button class="button button-small" type="submit">Filter <span>↗</span></button></form><div class="table-scroll"><table class="admin-table"><thead><tr><th>BOOKING / CUSTOMER</th><th>ROOM</th><th>DATES</th><th>GUESTS</th><th>TOTAL</th><th>STATUS</th><th>UPDATE</th></tr></thead><tbody><tr th:each="booking : ${bookings.content}"><td><strong class="reference-cell" th:text="${booking.bookingReference}">AH32FG5K</strong><small class="table-subline" th:text="${booking.user.fullName + ' · ' + booking.user.email}">Avery Collins</small></td><td th:text="${booking.room.name}">The City Deluxe</td><td th:text="${#temporals.format(booking.checkIn, 'MMM d') + ' - ' + #temporals.format(booking.checkOut, 'MMM d, yyyy')}">May 6 - May 9</td><td th:text="${booking.guests}">2</td><td th:text="${'$' + #numbers.formatDecimal(booking.totalPrice, 1, 2)}">$735.00</td><td><span class="status-pill" th:classappend="${' status-' + #strings.toLowerCase(booking.status.name())}" th:text="${booking.status}">CONFIRMED</span></td><td><form th:action="@{/admin/bookings/{reference}/status(reference=${booking.bookingReference})}" method="post" class="status-update-form"><select name="status"><option th:each="state : ${statuses}" th:value="${state}" th:selected="${state == booking.status}" th:text="${state}">CONFIRMED</option></select><button class="icon-action" type="submit" aria-label="Save status" title="Save status">✓</button></form></td></tr><tr th:if="${bookings.empty}"><td colspan="7" class="empty-table">No bookings match these filters.</td></tr></tbody></table></div><nav class="admin-pagination" th:if="${bookings.totalPages > 1}"><a th:if="${bookings.hasPrevious()}" th:href="@{/admin/bookings(page=${bookings.number - 1}, status=${selectedStatus}, fromDate=${fromDate}, toDate=${toDate}, search=${search})}">← Previous</a><span th:text="${'Page ' + (bookings.number + 1) + ' of ' + bookings.totalPages}">Page 1 of 3</span><a th:if="${bookings.hasNext()}" th:href="@{/admin/bookings(page=${bookings.number + 1}, status=${selectedStatus}, fromDate=${fromDate}, toDate=${toDate}, search=${search})}">Next →</a></nav></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
