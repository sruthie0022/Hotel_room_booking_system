<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room types | Aurelia House</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/site.css}" rel="stylesheet"><link th:href="@{/css/admin.css}" rel="stylesheet"></head>
<body class="admin-body"><div class="admin-shell"><div th:replace="~{fragments/admin-layout :: sidebar('room-types')}"></div><main class="admin-main"><header class="admin-topbar"><div><span class="eyebrow">INVENTORY SETTINGS</span><h1>Room types</h1></div><a class="button button-small" th:href="@{/admin/room-types/new}">Add a type <span>＋</span></a></header><div class="notice notice-success" th:if="${success}" th:text="${success}"></div><div class="notice notice-error" th:if="${error}" th:text="${error}"></div><section class="admin-panel"><div class="panel-heading"><div><span class="eyebrow">ROOM CATEGORIES</span><h2 th:text="${roomTypes.size() + ' types'}">3 types</h2></div></div><div class="table-scroll"><table class="admin-table"><thead><tr><th>TYPE</th><th>DESCRIPTION</th><th>ACTIONS</th></tr></thead><tbody><tr th:each="type : ${roomTypes}"><td><strong class="reference-cell" th:text="${type.name}">Deluxe</strong></td><td th:text="${type.description}">Elevated comfort with thoughtful details.</td><td><div class="table-actions"><a class="icon-action" th:href="@{/admin/room-types/{id}/edit(id=${type.id})}" aria-label="Edit room type" title="Edit room type">✎</a><form th:action="@{/admin/room-types/{id}/delete(id=${type.id})}" method="post"><button class="icon-action danger-action" type="submit" aria-label="Delete room type" title="Delete room type" data-confirm="Delete this room type? Types in use cannot be deleted.">×</button></form></div></td></tr><tr th:if="${roomTypes.isEmpty()}"><td colspan="3" class="empty-table">No room types have been added.</td></tr></tbody></table></div></section></main></div><script th:src="@{/js/admin.js}"></script></body></html>
